; BodyMorph VR 0.8.2 (BodySlide presets handed out to NPCs, BodyGen: templates.ini / morphs.ini engine, morphs stored per NPC, Papyrus BodyGen functions, auto-apply at attach, garments follow the body)
; Everything except [Keys] is re-read every time you press the apply key, so you can edit this file with the game running.
[Keys]
; Virtual-key codes in decimal. Test/lab keys, OFF by default (0): 119 = F8 (read-only probe), 118 = F7 (apply), 117 = F6 (restore). Do not use F5/F9: they are the game's quick save / quick load.
iProbeKey=0
iApplyKey=0
iRestoreKey=0

[Probe]
; F8 logs the geometry of the nearest NPCs to My Games\Fallout4VR\F4SE\BodyMorphVR.log. It changes nothing.
iMaxActors=2
; Search radius in game units, used by the probe and by the apply key (about 70 units = 1 metre).
iMaxDistance=600

[Morph]
; F7 = deform the NEAREST NPC with the sliders below, F6 = undo. Only shapes whose name is in the .tri are touched
; ("CBBE" in the FemaleBody.tri built by BodySlide with "Build Morphs"; the game's ":0" suffix is ignored).
sTriFile=Data\Meshes\Actors\Character\CharacterAssets\FemaleBody.tri
; Slider names as in the .tri (the log lists them at start-up), "name:weight" separated by commas. Weight 1.0 = slider at 100 %, may be negative.
; The names of your .tri include: PregnancyBelly (huge belly, easy to see), BreastsSmall, Breasts, BreastsGone, Butt, BigButt, BigBelly, PregnancyBelly, Hips, Waist, Arms, ...
sMorphs=PregnancyBelly:2.0
; 1 = the F7 key and the F3/F4 test keys only consider female NPCs. (BodyGen files and BodyGen.* scripts morph men too when their body has a .tri.)
bFemaleOnly=1
; The game renames the shapes of the nude skin ("NakedTorso (00000D67)[1]/SkinNaked (00000D64)"), so the .tri's own shape name ("CBBE") is not found.
; "start of the in-game name=shape in the .tri", comma separated.
sShapeAliases=NakedTorso=CBBE
; A shape matched by alias must have exactly this many vertices (the nude female torso has 22708), so another body that also starts with "NakedTorso" is never touched. 0 = no check.
iAliasVertexCount=22708

[Auto]
; 1 = the plugin applies morphs while the game builds an NPC (needs no key): the morphs stored for that NPC by the Papyrus BodyGen functions (Silhouette's scripts) or by the [Test] keys,
; and, when bUseGlobalSliders=1, the sMorphs above for NPCs that have none stored. 0 = the plugin does nothing at all (no hook work, UpdateMorphs has no effect).
; The INI and the .tri are re-read when you press F7 (NPCs built after that use the new values).
bEnabled=1
; 1 = an NPC with no stored morphs gets the sliders of [Morph] sMorphs (the old test behaviour: with the default every woman gets the big belly). 0 = such NPCs keep their own body.
bUseGlobalSliders=0
; 1 = each garment is morphed with the .tri its nif names in its BODYTRI extra data (BodySlide writes it when you build the outfit with "Build Morphs"), so clothes follow the body.
; 0 = only meshes whose shape name is in the global sTriFile above (the nude body) are morphed.
bUseBodyTri=1
; The log (BodyMorphVR.log) gets one "[attach]" line for each of the first N times the game attaches a female body or garment: what was found and what was done to every shape. 0 = off. F7 restarts the count.
iLogAttaches=120
; 1 = also morph the player's own third-person body.
bIncludePlayer=0
; 0 = swap the mesh at once (the engine loads its own meshes the same way). If you ever see a flicker or a missing body on a newly loaded NPC, try 100: the attach waits up to that many ms for the GPU upload.
iWaitUploadMs=0
; Diagnostic: after the first N auto-morphed meshes, scan the memory 4 s later and log whether the renderer's draw records were born from the clone (NEW_VB records, none left on OLD_VB for this NPC). 0 = off.
iScanFirst=0

[Presets]
; 0.8.0: the bodies NPCs get are the BodySlide presets you have installed. The plugin reads BodySlide's own files (SliderPresets, SliderSets) when the game starts
; and gives every NPC of the races below one preset, once; the result is stored per NPC in the F4SE co-save. To add bodies, install more BodySlide presets: nothing to build.
; The body on disk must be built with zeroed sliders and "Build Morphs" ticked (that writes FemaleBody.tri / MaleBody.tri with every slider in it).
bEnable=1
sFolder=Data\Tools\BodySlide
sFemaleTri=Data\Meshes\Actors\Character\CharacterAssets\FemaleBody.tri
sMaleTri=Data\Meshes\Actors\Character\CharacterAssets\MaleBody.tri
; Editor ids of the races that get preset bodies, comma separated.
sRaces=HumanRace
; Presets whose name contains one of these pieces are never handed out (comma separated, any case). A preset that changes nothing (all sliders at the base value) is left out by itself.
sExclude=(outfit),zeroed
; How often each preset comes up: its weight in [PresetWeights] below. A preset with no line there:
;   bAutoWeights=1: 3, 2 or 1 by how far it is from the base body, compared with your other presets (the mildest third comes up most often, the most extreme third least).
;   bAutoWeights=0: iDefaultWeight.
bAutoWeights=1
iDefaultWeight=2
; 1 = presets decide for everybody except the NPCs a BodyGen ini names one by one (FormID lines, e.g. Silhouette's named people) or by plugin. 0 = an "All|Female|HumanRace=..." line of a BodyGen ini wins over the presets.
bOverGeneralRules=1
; Sliders no preset may set: other mods drive them at run time (a preset saved with one of them at 100 would leave it on for ever).
sNeverMorphs=Erection,Erection Up,Erection Down,CErection,VaginaPenetrate,AnusPenetrate,VaginaSpread,ButtcheeksSpread
; Only if your body is NOT built with zeroed sliders: the name of the preset it was built with (or "(defaults)" for the slider set's defaults). Every body is then given as the difference to it.
sFemaleBuiltWith=
sMaleBuiltWith=
; A preset counts as made for a body when at least this share of its sliders exists in that body's .tri.
iMinFitPercent=50
; 0.8.2: variation per NPC, in percent (0 = off). Every slider the drawn preset sets is multiplied by its own random factor between 1 - x % and 1 + x %,
; so two NPCs with the same preset still get different bodies. Saved per NPC like the preset; NPCs that already have a body keep it.
iVariationPercent=20
; 1 = one line on the HUD after loading a save when the .tri files or the presets are missing.
bNotify=1

[PresetWeights]
; Preset name=weight (how many tickets it has in the draw). 0 = never. Names exactly as BodySlide shows them. Add your own lines; presets without a line follow bAutoWeights.
CBBE Slim=3
CBBE Athletic=3
Imitation - UNP #1=3
Imitation - UNP #2=3
Imitation - Dream Girl=3
CBBE Curvy=2
CBBE Petite=2
CBBE Chubby=2
SevenBase Slim=2
Imitation - UNP Skinny=1
SevenBase=1
SevenBase Upper=1
SevenBase Lower=1
BT - Average=3
BT - Swimmer=3
BT - Thin=3
BT - Chubby=2
BT - Muscular=2
BT - Bodybuilder=1

[BodyGen]
; The BodyGen engine, for NPCs that a BodyGen ini names (and for everybody when [Presets] is off): morphs rolled from the templates.ini / morphs.ini files that Silhouette and other BodyGen mods ship, the first time the game builds the NPC
; (the result is stored per NPC and saved in the F4SE co-save). Files are read ONCE when the game starts, from Data\F4SE\Plugins\F4EE\BodyGen\<Plugin.esp>\ (plugins that are loaded) and Loose\*_templates.ini / *_morphs.ini.
; Examples to copy: BodyMorphVR_examples\BodyGen\Loose\ next to this file inside the mod.
bEnable=1
sFolder=Data\F4SE\Plugins\F4EE\BodyGen
; The log (BodyMorphVR.log) gets one "[bodygen]" line for each of the first N rolls: the actor, its template chain and race, the line that decided and the morphs it got. 0 = off.
iLogActors=60
; 0 = a different roll every game start. Any other number gives the same rolls every time (for tests).
iSeed=0

[Lab]
; 0.6.3: both are OFF by default. With them on, loading a second save in one session crashed the NVIDIA driver (stale draw records); they are diagnostics only.
; The change used to show up seconds or minutes late because the engine draws from small "draw records" that keep their own copy of the mesh pointer.
; 1 = after every apply / restore, scan the game's memory for copies of the mesh pointers and log them (a few seconds in the background; a short stutter is normal).
iScan=0
; 1 = repoint those draw records at the clone after F7 and back at the original after F6, so the change shows as soon as the scan ends (about 4 s).
; NOTE: every NPC that shares the same body mesh is affected while the morph is applied (lab limitation).
iPatchHolders=0

[Test]
; Test keys, OFF by default (0). Set 114 for F3 and 115 for F4 to try them. They do what a script's BodyGen.SetMorph + UpdateMorphs would do, to the NEAREST NPC (see iMaxDistance):
;   F3 = store the morphs of sStoreMorphs for that NPC and put them on its body now (the NPC keeps them when you save and load: they are written to the F4SE co-save),
;   F4 = remove its stored morphs and put its own body back.
iSetKey=0
iClearKey=0
sStoreMorphs=PregnancyBelly:2.0
